<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>본인 소개 페이지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="profile-card">
      <img src="profile.jpg" alt="프로필 사진" class="profile-img">

      <h1>김영선</h1>
      <p class="subtitle">AI소프트웨어공학부 재학생</p>

      <section>
        <h2>자기소개</h2>
        <p>
          안녕하세요. 저는 AI소프트웨어공학부에서 공부하고 있으며,
          파이썬과 웹 프로그래밍에 관심이 있습니다.
        </p>
      </section>

      <section>
        <h2>관심 분야</h2>
        <ul>
          <li>인공지능</li>
          <li>웹 개발</li>
          <li>의료 데이터 분석</li>
        </ul>
      </section>

      <section>
        <h2>목표</h2>
        <p>
          앞으로 의료 현장에서 활용할 수 있는 AI 프로그램을 개발하는 것이 목표입니다.
        </p>
      </section>

      <section>
        <h2>연락처</h2>
        <p>Email: example@email.com</p>
      </section>
    </div>
  </div>

</body>
</html>
